# conda 全量环境（推荐：conda env create -f environment.yml）
name: aicrispr
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - biopython>=1.81
  - matplotlib>=3.7
  - jupyter
  - pip:
      - torch>=2.1
      - transformers>=4.36
      - peft>=0.7
      - cobra>=0.29
      - pypdf>=4.0
      - huggingface_hub>=0.20
      - pysam  # Linux/macOS 可装；Windows 需预编译
